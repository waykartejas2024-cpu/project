<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>softlayer</title>
    <link rel="stylesheet" href="./try.css">
</head>

<body>

    <div class="container">
        <header class="header">
            <div class="logo">
                <strong class="brand">Softlayer</strong>
            </div>

            <nav class="nav">
                <a href="#">HOME</a>
                <a href="#">KIDS</a>
                <a href="#">SHIRT</a>
                <a href="#">JEANS</a>
            </nav>

            <div class="search">
                <input type="text" placeholder="Search in softlayer">
                <button class="btn">SEARCH</button>
            </div>
        </header>
    </div>

    <div class="container">

        <!-- HERO -->
        <section class="hero">
            <div class="hero-gradient">
                <div class="hero-text">
                    <h1>Welcome to Softlayer</h1>
                    <p>Quality shirts at friendly prices</p>
                </div>
            </div>
        </section>

        <!-- PRODUCTS -->
        <section class="products">

            <article class="product-card">
                <img class="im" src="./images/shirt2.jpeg">
                <h3>Classic Cotton Shirt</h3>
                <div class="price">₹699</div>
                <button class="btn" onclick="addToCart('Classic Cotton Shirt',699)">Add to Cart</button>
            </article>

            <article class="product-card">
                <img class="im" src="./images/shirt4.jpeg">
                <h3>Denim Casual Shirt</h3>
                <div class="price">₹999</div>
                <button class="btn" onclick="addToCart('Denim Casual Shirt',999)">Add to Cart</button>
            </article>

            <article class="product-card">
                <img class="im" src="./images/levi.png">
                <h3>Solid Slim Fit Shirt</h3>
                <div class="price">₹1399</div>
                <button class="btn" onclick="addToCart('Solid Slim Fit Shirt',1399)">Add to Cart</button>
            </article>

            <article class="product-card">
                <img class="im" src="./images/shirt3.jpeg">
                <h3>Striped Polo</h3>
                <div class="price">₹799</div>
                <button class="btn" onclick="addToCart('Striped Polo',799)">Add to Cart</button>
            </article>

        </section>

        <!-- CART -->
        <section class="cart">
            <h2>🛒 Your Cart</h2>
            <ul id="cart-items"></ul>
            <h3>Total: ₹<span id="total">0</span></h3>
            <button class="btn" onclick="showForm()">Place Order</button>
        </section>

        <!-- ORDER FORM -->
        <section id="order-form" style="display:none;">
            <h2>📦 Order Form</h2>

            <form onsubmit="placeOrder(event)">
                <input type="text" id="name" placeholder="Full Name" required><br><br>
                <input type="text" id="address" placeholder="Address" required><br><br>
                <input type="tel" id="mobile" placeholder="Mobile Number" required><br><br>

                <button class="btn">Confirm Order</button>
            </form>
        </section>

    </div>

    <footer class="site-footer">
        © 2025 Softlayer created by tejas waykar
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({
                name,
                price
            });
            total += price;
            updateCart();
        }

        function updateCart() {
            let list = document.getElementById("cart-items");
            let totalEl = document.getElementById("total");

            list.innerHTML = "";

            cart.forEach(item => {
                let li = document.createElement("li");
                li.innerText = item.name + " - ₹" + item.price;
                list.appendChild(li);
            });

            totalEl.innerText = total;
        }

        function showForm() {
            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }
            document.getElementById("order-form").style.display = "block";
        }

        function placeOrder(e) {
            e.preventDefault();

            let name = document.getElementById("name").value;

            alert("✅ Order Placed!\nThank you " + name + "\nTotal: ₹" + total);

            cart = [];
            total = 0;
            updateCart();

            document.getElementById("order-form").style.display = "none";
        }
    </script>

</body>

</html>
